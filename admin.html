<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1923">
<title>محفظتي — الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--card:#111827;--card2:#1a2436;--accent:#f59e0b;--accent2:#10b981;--accent3:#ef4444;--accent4:#3b82f6;--purple:#a78bfa;--text:#f1f5f9;--muted:#64748b;--border:#1e2d42;--radius:18px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* GATE */
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.gate-card{background:var(--card);border-radius:24px;border:1px solid var(--border);padding:28px 24px;width:100%;max-width:380px;text-align:center;}
.gate-logo{font-size:3rem;margin-bottom:8px;}
.gate-title{font-size:1.5rem;font-weight:900;color:var(--accent);margin-bottom:4px;}
.gate-sub{font-size:.82rem;color:var(--muted);margin-bottom:24px;}
.lf{margin-bottom:12px;text-align:right;}
.lf label{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:5px;}
.lf input{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:'Cairo',sans-serif;font-size:.9rem;padding:12px 14px;outline:none;}
.lf input:focus{border-color:var(--accent);}
.btn-main{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),#d97706);border:none;border-radius:12px;color:#000;font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:900;cursor:pointer;margin-top:6px;}
.err{color:var(--accent3);font-size:.78rem;text-align:center;margin-top:8px;min-height:18px;}
/* TOPBAR */
#admin-page{display:none;}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,15,26,.95);backdrop-filter:blur(16px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.topbar-left{display:flex;flex-direction:column;}
.topbar-title{font-size:1rem;font-weight:900;color:var(--accent);}
.topbar-sub{font-size:.68rem;color:var(--muted);}
.btn-sm{padding:6px 12px;border-radius:10px;border:none;font-family:'Cairo',sans-serif;font-size:.74rem;font-weight:700;cursor:pointer;}
.btn-back{background:var(--card2);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;}
.btn-out{background:rgba(239,68,68,.15);color:var(--accent3);}
main{padding:16px;max-width:480px;margin:auto;}
.section-title{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin:18px 0 10px;}
/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:12px;text-align:center;}
.stat-val{font-size:1.4rem;font-weight:900;}
.stat-lbl{font-size:.64rem;color:var(--muted);margin-top:2px;}
/* FORM */
.form-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:14px;}
.form-title{font-size:.76rem;color:var(--muted);font-weight:700;margin-bottom:14px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin-bottom:5px;}
.field input,.field select{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:'Cairo',sans-serif;font-size:.88rem;padding:11px 13px;outline:none;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field select option{background:var(--card2);}
/* USER CARDS */
.user-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;animation:si .25s ease;}
@keyframes si{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.user-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.user-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;color:#fff;flex-shrink:0;}
.user-name{font-weight:700;font-size:.9rem;}
.user-email{font-size:.68rem;color:var(--muted);margin-top:1px;}
.role-tag{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.user-acts{display:flex;gap:7px;}
.btn-edit{flex:1;padding:8px;background:var(--card2);border:none;border-radius:10px;color:var(--text);font-family:'Cairo',sans-serif;font-size:.74rem;font-weight:700;cursor:pointer;}
.btn-del{flex:1;padding:8px;background:rgba(239,68,68,.15);border:none;border-radius:10px;color:var(--accent3);font-family:'Cairo',sans-serif;font-size:.74rem;font-weight:700;cursor:pointer;}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:22px 18px 38px;border-top:1px solid var(--border);animation:su .3s ease;max-height:92vh;overflow-y:auto;position:relative;}
@keyframes su{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-title{font-size:1rem;font-weight:900;margin-bottom:16px;text-align:center;}
.modal-close{position:absolute;left:16px;top:16px;background:var(--card2);border:none;color:var(--muted);border-radius:50%;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn-save{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),#d97706);border:none;border-radius:var(--radius);color:#000;font-family:'Cairo',sans-serif;font-size:.92rem;font-weight:900;cursor:pointer;margin-top:12px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:9px 18px;font-size:.82rem;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="loading" id="loading"><div style="font-size:2.5rem">⚙️</div><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<!-- GATE: password + firebase login -->
<div id="gate" style="display:none">
  <div class="gate-card">
    <div class="gate-logo">⚙️</div>
    <div class="gate-title">لوحة الإدارة</div>
    <div class="gate-sub" id="gate-sub">ادخل باسورد الإدارة</div>
    <div id="gate-pass-section">
      <div class="lf"><label>باسورد الإدارة</label><input type="password" id="gate-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkGate()"></div>
      <button class="btn-main" onclick="checkGate()">🔓 تأكيد</button>
    </div>
    <div id="gate-login-section" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px;">
      <div class="lf"><label>إيميل الأدمن</label><input type="email" id="admin-email-inp" placeholder="example@email.com"></div>
      <div class="lf"><label>كلمة المرور</label><input type="password" id="admin-pass-inp" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
      <button class="btn-main" onclick="doAdminLogin()">🔐 دخول</button>
    </div>
    <div class="err" id="gate-err"></div>
    <div style="margin-top:16px;"><a href="index.html" style="font-size:.78rem;color:var(--muted);text-decoration:none;">← رجوع للتطبيق</a></div>
  </div>
</div>

<!-- ADMIN PAGE -->
<div id="admin-page">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">⚙️ لوحة الإدارة</div>
      <div class="topbar-sub" id="admin-logged-email"></div>
    </div>
    <div style="display:flex;gap:8px;">
      <a href="index.html" class="btn-sm btn-back">← التطبيق</a>
      <button class="btn-sm btn-out" onclick="doLogout()">خروج</button>
    </div>
  </div>
  <main>
    <div class="section-title">إحصائيات</div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--accent)" id="st-all">0</div><div class="stat-lbl">إجمالي</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--accent4)" id="st-mgr">0</div><div class="stat-lbl">مدير</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--accent2)" id="st-emp">0</div><div class="stat-lbl">موظف</div></div>
    </div>

    <div class="form-card">
      <div class="form-title">➕ إضافة حساب جديد</div>
      <div class="field"><label>الاسم</label><input type="text" id="nu-name" placeholder="اسم المستخدم"></div>
      <div class="field"><label>الإيميل</label><input type="email" id="nu-email" placeholder="example@email.com"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="nu-pass" placeholder="6 حروف على الأقل"></div>
      <div class="field">
        <label>الدور</label>
        <select id="nu-role">
          <option value="employee">👷 موظف — عنده داتا خاصة بيه</option>
          <option value="manager">👔 مدير — يشوف داتا الموظفين</option>
        </select>
      </div>
      <button class="btn-main" onclick="createUser()" style="margin-top:4px;">➕ إضافة</button>
      <div class="err" id="nu-err"></div>
    </div>

    <div class="section-title">الحسابات الحالية</div>
    <div id="users-list" style="margin-bottom:40px;"></div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="edit-overlay" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <button class="modal-close" onclick="closeEdit()">✕</button>
    <div class="modal-title" id="edit-title">تعديل الحساب</div>
    <div class="field"><label>الدور</label>
      <select id="edit-role">
        <option value="employee">👷 موظف</option>
        <option value="manager">👔 مدير</option>
      </select>
    </div>
    <div class="field"><label>كلمة مرور جديدة (اتركها فاضية لو مش عايز تغير)</label><input type="password" id="edit-pass" placeholder="اختياري — 6 حروف على الأقل"></div>
    <button class="btn-save" onclick="saveEdit()">💾 حفظ</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const FC = {
  apiKey:"AIzaSyB8Q-a3VMbl4ok9-kM5MVgPC7RvPN9czbw",
  authDomain:"ma7fazty-b023c.firebaseapp.com",
  projectId:"ma7fazty-b023c",
  storageBucket:"ma7fazty-b023c.firebasestorage.app",
  messagingSenderId:"656857674800",
  appId:"1:656857674800:web:15f0bf95bef8b8bbada9f5"
};
const ADMIN_PASS = 'Mahfazty@Admin2026'; // ← غيره لو عايز
const API_KEY    = FC.apiKey;

const app  = initializeApp(FC);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let editingUid  = null;
let gateOK      = false;

const fmt  = n => Number(n||0).toLocaleString('ar-EG');
const toast= msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); };
const load = v  => document.getElementById('loading').style.display = v?'flex':'none';

// ── GATE ──
window.checkGate = () => {
  const p = document.getElementById('gate-pass').value;
  const e = document.getElementById('gate-err');
  if(p !== ADMIN_PASS){ e.textContent='⚠️ الباسورد غلط'; document.getElementById('gate-pass').value=''; return; }
  gateOK = true; e.textContent='';
  if(currentUser){
    showAdmin();
  } else {
    document.getElementById('gate-pass-section').style.display='none';
    document.getElementById('gate-login-section').style.display='block';
    document.getElementById('gate-sub').textContent='ادخل بحساب Firebase الخاص بيك';
  }
};

window.doAdminLogin = async () => {
  const email = document.getElementById('admin-email-inp').value.trim();
  const pass  = document.getElementById('admin-pass-inp').value;
  const e     = document.getElementById('gate-err');
  if(!email||!pass){ e.textContent='⚠️ ادخل الإيميل وكلمة المرور'; return; }
  try{
    load(true);
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(err){
    load(false);
    e.textContent = err.code==='auth/invalid-credential'?'⚠️ الإيميل أو كلمة المرور غلط':'⚠️ حصل خطأ';
  }
};

window.doLogout = async () => {
  if(!confirm('هتخرج؟'))return;
  gateOK=false;
  await signOut(auth);
  document.getElementById('admin-page').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('gate-pass-section').style.display='block';
  document.getElementById('gate-login-section').style.display='none';
  document.getElementById('gate-pass').value='';
  document.getElementById('gate-err').textContent='';
};

// ── AUTH STATE ──
onAuthStateChanged(auth, async user => {
  load(false);
  if(user){
    currentUser = user;
    document.getElementById('admin-logged-email').textContent = user.displayName||user.email;
    if(gateOK) showAdmin();
    else document.getElementById('gate').style.display='flex';
  } else {
    currentUser = null;
    document.getElementById('gate').style.display='flex';
    document.getElementById('admin-page').style.display='none';
  }
});

function showAdmin(){
  document.getElementById('gate').style.display='none';
  document.getElementById('admin-page').style.display='block';
  loadUsers();
}

// ── LOAD USERS ──
async function loadUsers(){
  const list = document.getElementById('users-list');
  list.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px;font-size:.82rem;">جاري التحميل...</div>';
  try{
    const snap = await getDocs(collection(db,'accounts'));
    const users = snap.docs.map(d=>({id:d.id,...d.data()}));

    document.getElementById('st-all').textContent = users.length;
    document.getElementById('st-mgr').textContent = users.filter(u=>u.role==='manager').length;
    document.getElementById('st-emp').textContent = users.filter(u=>u.role==='employee').length;

    list.innerHTML='';
    if(!users.length){
      list.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:2.5rem;margin-bottom:8px;">👥</div>ملفيش حسابات لسه</div>';
      return;
    }
    users.forEach(u => {
      const isMgr   = u.role==='manager';
      const clr     = isMgr?'var(--accent4)':'var(--accent2)';
      const bgClr   = isMgr?'linear-gradient(135deg,var(--accent4),#1d4ed8)':'linear-gradient(135deg,var(--accent2),#047857)';
      const roleLabel = isMgr?'👔 مدير':'👷 موظف';
      const card = document.createElement('div');
      card.className='user-card';
      card.innerHTML=`
        <div class="user-head">
          <div class="user-av" style="background:${bgClr}">${(u.name||'?')[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0;">
            <div class="user-name">${u.name||'بدون اسم'}</div>
            <div class="user-email">${u.email||''}</div>
          </div>
          <span class="role-tag" style="border:1px solid ${clr};color:${clr};">${roleLabel}</span>
        </div>
        <div class="user-acts">
          <button class="btn-edit" onclick="openEdit('${u.id}','${(u.name||'').replace(/'/g,"\\'")}','${u.role}')">✏️ تعديل</button>
          <button class="btn-del" onclick="deleteUser('${u.id}','${(u.name||'').replace(/'/g,"\\'")}')">🗑 حذف</button>
        </div>`;
      list.appendChild(card);
    });
  } catch(e){
    list.innerHTML='<div style="text-align:center;padding:20px;color:var(--accent3);">⚠️ حصل خطأ في التحميل</div>';
  }
}

// ── CREATE USER ──
window.createUser = async () => {
  const name  = document.getElementById('nu-name').value.trim();
  const email = document.getElementById('nu-email').value.trim();
  const pass  = document.getElementById('nu-pass').value;
  const role  = document.getElementById('nu-role').value;
  const err   = document.getElementById('nu-err');
  err.textContent='';
  if(!name||!email||!pass){ err.textContent='⚠️ ادخل كل البيانات'; return; }
  if(pass.length<6){ err.textContent='⚠️ كلمة المرور 6 حروف على الأقل'; return; }
  try{
    // create Firebase Auth user via REST
    const res  = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email, password:pass, displayName:name, returnSecureToken:true})
    });
    const data = await res.json();
    if(data.error){ err.textContent='⚠️ '+(data.error.message==='EMAIL_EXISTS'?'الإيميل موجود بالفعل':'حصل خطأ: '+data.error.message); return; }
    const uid = data.localId;
    // save in global accounts collection
    await setDoc(doc(db,'accounts',uid),{ uid, name, email, role, createdAt:new Date().toISOString() });
    // save in user's own settings
    await setDoc(doc(db,'users',uid,'settings','profile'),{ uid, name, email, role });
    ['nu-name','nu-email','nu-pass'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('nu-role').value='employee';
    toast(`✅ تم إضافة ${name}`);
    loadUsers();
  } catch(e){ err.textContent='⚠️ حصل خطأ، حاول تاني'; }
};

// ── EDIT ──
window.openEdit = (uid, name, role) => {
  editingUid = uid;
  document.getElementById('edit-title').textContent = `✏️ ${name}`;
  document.getElementById('edit-role').value = role;
  document.getElementById('edit-pass').value = '';
  document.getElementById('edit-overlay').classList.add('show');
};
window.closeEdit = () => document.getElementById('edit-overlay').classList.remove('show');

window.saveEdit = async () => {
  const role = document.getElementById('edit-role').value;
  const pass = document.getElementById('edit-pass').value;
  try{
    await updateDoc(doc(db,'accounts',editingUid),{ role });
    await updateDoc(doc(db,'users',editingUid,'settings','profile'),{ role });
    if(pass.length>=6){
      await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${API_KEY}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({idToken: await auth.currentUser.getIdToken(), password:pass, returnSecureToken:false})
      });
    }
    closeEdit(); toast('✅ تم الحفظ'); loadUsers();
  } catch(e){ toast('⚠️ حصل خطأ'); }
};

// ── DELETE ──
window.deleteUser = async (uid, name) => {
  if(!confirm(`هتحذف حساب ${name}؟`))return;
  try{
    await deleteDoc(doc(db,'accounts',uid));
    await updateDoc(doc(db,'users',uid,'settings','profile'),{ role:'blocked' });
    toast(`🗑 تم حذف ${name}`); loadUsers();
  } catch(e){ toast('⚠️ حصل خطأ'); }
};
</script>
</body>
</html>
